# Builds both Android apps, signs them with your stable key and publishes a GitHub release.
# Create this file in your repository at:  .github/workflows/build-release.yml
name: Build and release

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'signing/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Private values come from Settings > Secrets and variables > Actions. They are never stored in the code.
      GAS_URL: ${{ secrets.GAS_URL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
      GITHUB_REPO: ${{ github.repository }}
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that no secret or private address is committed
        run: bash scripts/check-secrets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare web files (config from secrets, fonts, pdf.js)
        run: |
          node scripts/make-config.mjs
          bash scripts/fetch-assets.sh

      - name: Unlock the signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -f signing/signage.keystore.enc ] && [ -n "$SIGNING_PASSPHRASE" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in signing/signage.keystore.enc \
              -out "$RUNNER_TEMP/signage.keystore" -pass env:SIGNING_PASSPHRASE
            echo "SIGN_KEYSTORE=$RUNNER_TEMP/signage.keystore" >> "$GITHUB_ENV"
            echo "SIGN_PASSWORD=$SIGNING_PASSPHRASE" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key found. Run the 'Create signing key' workflow first. Building with a temporary key."
          fi

      - name: Build the screen app
        run: gradle -p apps/screen-android assembleRelease --no-daemon

      - name: Build the admin app
        run: gradle -p apps/admin-android assembleRelease --no-daemon

      - name: Collect files and write release notes
        run: |
          mkdir -p out
          cp apps/screen-android/app/build/outputs/apk/release/*.apk out/signage-screen.apk
          cp apps/admin-android/app/build/outputs/apk/release/*.apk out/signage-admin.apk
          bash scripts/release-notes.sh "v1.0.${{ github.run_number }}" > out/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/signage-admin.apk out/signage-screen.apk \
            --title "Dur Al-Razi Signage 1.0.${{ github.run_number }}" \
            --notes-file out/notes.md \
            --target "${{ github.sha }}"
