name: Build screen APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Download fonts, icons, pdf.js
        run: bash scripts/fetch-assets.sh
      - name: Copy screen UI into the APK assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web
          rm -rf android/app/src/main/assets/web/admin
      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DurAlRazi-Screen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
